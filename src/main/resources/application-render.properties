# Render asigna el puerto; el servidor escucha en todas las interfaces.
server.address=0.0.0.0
server.port=${PORT:10000}
spring.application.name=hotel404

# Los datos de Aiven se escriben en Render, nunca en el repositorio.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME:defaultdb}?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/tmp/aiven-truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit&connectionTimeZone=America/Guatemala
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# Las tablas ya fueron importadas: no crearlas ni modificarlas al iniciar.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jackson.time-zone=America/Guatemala
hotel.demo=false

# El frontend reenvía las peticiones y el navegador utiliza una sola URL.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
